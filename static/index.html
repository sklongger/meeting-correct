<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Correct - 实时事实核查</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --bg-dark: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252540;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景动效 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                var(--bg-dark);
            z-index: -1;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
        }

        /* Header */
        .header {
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            background: rgba(15, 15, 26, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--success));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--primary);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        /* Main Content */
        .main {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .stats-inline {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-item.success .stat-num {
            color: var(--success);
        }

        .stat-item.danger .stat-num {
            color: var(--danger);
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Results Section */
        .results-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary), var(--success));
            border-radius: 2px;
        }

        .results-list {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding: 16px;
        }

        .results-list::-webkit-scrollbar {
            width: 6px;
        }

        .results-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .results-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .result-card.verified {
            border-left: 3px solid var(--success);
        }

        .result-card.unverified {
            border-left: 3px solid var(--danger);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .result-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .result-badge.verified {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            box-shadow: 0 0 20px var(--success-glow);
        }

        .result-badge.unverified {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            box-shadow: 0 0 20px var(--danger-glow);
        }

        .result-claim {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            flex: 1;
        }

        .result-summary {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            padding-left: 12px;
            border-left: 2px solid var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Transcript Panel */
        .transcript-panel {
            position: sticky;
            top: 120px;
        }

        .transcript-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .transcript-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .transcript-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--success);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px var(--success);
        }

        .transcript-content {
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
            scroll-behavior: smooth;
        }

        .transcript-content::-webkit-scrollbar {
            width: 4px;
        }

        .transcript-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .transcript-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .transcript-line {
            padding: 4px 0;
            animation: fadeIn 0.3s ease;
        }

        .transcript-time {
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .transcript-empty {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
                padding: 24px;
            }

            .transcript-panel {
                position: relative;
                top: 0;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }

            .stats-bar {
                flex-direction: column;
                gap: 12px;
            }

            .stat-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">🔍</div>
                <div class="logo-text">云启<span>meeting-correct</span></div>
            </div>
            <div class="stats-inline">
                <div class="stat-item">
                    <span class="stat-num" id="total">0</span>
                    <span class="stat-lbl">核查总数</span>
                </div>
                <div class="stat-item success">
                    <span class="stat-num" id="verified">0</span>
                    <span class="stat-lbl">已验证</span>
                </div>
                <div class="stat-item danger">
                    <span class="stat-num" id="unverified">0</span>
                    <span class="stat-lbl">存疑</span>
                </div>
            </div>
        </div>
        <div id="status-badge" class="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">连接中...</span>
        </div>
    </header>

    <main class="main">
        <div class="content">
            <div class="results-section">
                <div class="section-header">
                    <div class="section-title">核查结果</div>
                </div>
                <div class="results-list" id="results">
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <p>等待实时数据...</p>
                        <p style="font-size: 12px; margin-top: 8px;">开始说话后，系统将自动检测并核查事实</p>
                    </div>
                </div>
            </div>
        </div>

        <aside class="transcript-panel">
            <div class="transcript-card">
                <div class="transcript-header">
                    <div class="transcript-title">
                        <span>📝</span>
                        <span>实时转录</span>
                    </div>
                    <div class="live-indicator">
                        <span class="live-dot"></span>
                        <span>LIVE</span>
                    </div>
                </div>
                <div class="transcript-content" id="transcript">
                    <div class="transcript-empty">
                        <span style="font-size: 32px;">🎙️</span>
                        <p style="margin-top: 12px;">等待语音输入...</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    

    <script>
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const transcriptEl = document.getElementById('transcript');
        const resultsEl = document.getElementById('results');

        let lastTranscript = '';
        let lastResultsJson = '';

        const ws = new WebSocket(`ws://${location.host}/ws`);
        
        ws.onopen = () => {
            statusBadge.className = 'status-badge connected';
            statusText.textContent = '已连接';
        };
        
        ws.onclose = () => {
            statusBadge.className = 'status-badge disconnected';
            statusText.textContent = '连接断开';
        };
        
        ws.onerror = () => {
            statusBadge.className = 'status-badge disconnected';
            statusText.textContent = '连接错误';
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            updateDisplay(data);
        };

        function updateDisplay(data) {
            const results = data.results || [];
            const transcript = data.transcript || '';

            // 更新统计
            document.getElementById('total').textContent = results.length;
            document.getElementById('verified').textContent = results.filter(r => r.verified).length;
            document.getElementById('unverified').textContent = results.filter(r => !r.verified).length;

            // 更新转录文本
            if (transcript && transcript !== lastTranscript) {
                lastTranscript = transcript;
                const lines = transcript.split('\n').filter(l => l.trim());
                transcriptEl.innerHTML = lines.map(line => 
                    `<div class="transcript-line">${escapeHtml(line)}</div>`
                ).join('');
                // 自动滚动到底部
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
            }

            // 更新结果列表（倒序）- 只有结果变化时才更新
            const resultsJson = JSON.stringify(results);
            if (resultsJson !== lastResultsJson) {
                lastResultsJson = resultsJson;
                if (results.length > 0) {
                    const html = [...results].reverse().map((r, i) => `
                        <div class="result-card ${r.verified ? 'verified' : 'unverified'}" style="animation-delay: ${i * 0.05}s">
                            <div class="result-header">
                                <span class="result-badge ${r.verified ? 'verified' : 'unverified'}">
                                    ${r.verified ? '✓ 已验证' : '✗ 存疑'}
                                </span>
                                ${r.time ? `<span class="transcript-time">${r.time}</span>` : ''}
                                <span class="result-claim">${escapeHtml(r.claim)}</span>
                            </div>
                            <div class="result-summary">${escapeHtml(r.summary || '')}</div>
                        </div>
                    `).join('');
                    resultsEl.innerHTML = html;
                    // 滚动到顶部显示最新结果
                    resultsEl.scrollTop = 0;
                } else {
                    resultsEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🎯</div>
                            <p>等待实时数据...</p>
                            <p style="font-size: 12px; margin-top: 8px;">开始说话后，系统将自动检测并核查事实</p>
                        </div>
                    `;
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
